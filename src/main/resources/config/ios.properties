# iOS defaults (XCUITest driver). Needs a Mac with Xcode. Set APP_PATH (.app or .ipa) or APP_ID (bundle id) for your own app.
device.name=iPhone 16
udid=
platform.version=

# App under test. Default: the Settings app that exists on every iPhone and simulator (for the sample tests).
# Your own app: app.path=apps/MyApp.app
app.path=
app.id=com.apple.Preferences
app.activity=

# Real device only: signing for WebDriverAgent. Simulators do not need it.
xcode.org.id=
xcode.signing.id=iPhone Developer
# Parallel runs: every device needs its own WebDriverAgent port
wda.port=0
