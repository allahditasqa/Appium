# Common settings for every platform.
# Override order (the first one wins):
#   1) TestNG parameters (suites/parallel.xml)   2) -Dkey=value   3) environment variable (KEY in UPPERCASE, dots become underscores)
#   4) config/local.properties (git-ignored)     5) config/<platform>.properties   6) this file
# Example: mvn test -Ddevice.name=Pixel_8      or      set DEVICE_NAME=Pixel_8

# android | ios   (command line: -Dplatform=ios)
platform=android

# Appium server: local  = the framework starts one if none is running yet
#                remote = your own server (appium.server.url)
#                cloud  = a cloud grid such as BrowserStack (appium.server.url + cloud.provider)
appium.server.mode=local
appium.server.url=http://127.0.0.1:4723
appium.local.port=4723
# Optional: full path of Appium's main.js if the Java client cannot find it (or set APPIUM_BINARY_PATH)
appium.main.js=

# Waits and timeouts
explicit.wait.seconds=20
implicit.wait.seconds=0
new.command.timeout.seconds=300

# true = keep the app data between sessions (faster), false = fresh install state for every test
no.reset=true

# Retries: 0 means a failing test is not repeated, so flaky tests stay visible
retry.count=0

# Reports and logs (reports contain device screenshots, so they are git-ignored)
reports.dir=reports

# Cloud (BrowserStack): cloud.provider=browserstack, appium.server.mode=cloud,
# appium.server.url=https://hub-cloud.browserstack.com/wd/hub, and the environment variables
# BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY (never put credentials in a file)
cloud.provider=
cloud.project=Mobile Automation
cloud.build=local
