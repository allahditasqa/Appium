# Android defaults (UiAutomator2 driver). Set APP_PATH (apk) or APP_ID (package) to test your own app.
device.name=Android Device
# Empty = the one connected device or emulator (see `adb devices`). With several devices, set the UDID.
udid=
platform.version=

# App under test. Default: the Settings app that exists on every Android device, so the sample tests run without an apk.
# Your own app: app.path=apps/my-app.apk   (or app.id=com.example.app)
app.path=
app.id=com.android.settings
# Empty = Appium finds the launcher activity itself
app.activity=

# Parallel runs: every device needs its own port (set by a TestNG parameter in suites/parallel.xml)
system.port=0
