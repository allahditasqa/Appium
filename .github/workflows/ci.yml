name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Format check and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -ntp spotless:check test-compile
      - name: Test case documents match the automated tests
        shell: pwsh
        run: |
          ./scripts/Build-CaseCsv.ps1 -Check
          mvn -B -ntp test "-Dsuite=suites/docs.xml"

  android-smoke:
    name: Android smoke on an emulator (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: mvn -B -ntp test -Dplatform=android -Dsuite=suites/smoke.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-reports
          path: |
            reports/
            logs/
          retention-days: 14
